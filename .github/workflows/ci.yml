name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d archlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm -r run lint

      - name: Run typecheck
        run: pnpm -r run typecheck

      - name: Verify fresh DB migration & idempotent re-runs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/archlens
        run: |
          pnpm --filter @archlens/api db:migrate
          pnpm --filter @archlens/api db:migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/archlens
        run: pnpm -r run test

      - name: Verify database schema & migration consistency (no drift)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/archlens
        run: pnpm --filter @archlens/api db:check

      - name: Dependency security audit
        run: pnpm audit --prod || true
        continue-on-error: true

      - name: Run production build
        run: pnpm -r run build

      - name: Validate whitespace & git diff
        run: git diff --check

  docker:
    name: Validate Docker Builds & Compose
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate API Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: archlens-api:ci

      - name: Validate Web Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: archlens-web:ci

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Compose smoke test
        run: |
          docker compose up -d
          timeout 60 bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} archlens-api-sim 2>/dev/null)" = "healthy" ]; do sleep 2; done'
          curl -fsS http://127.0.0.1:3000/health/liveness
          curl -fsS http://127.0.0.1:3000/health/readiness
          curl -fsS http://127.0.0.1:8080/health/liveness
          docker compose down -v
